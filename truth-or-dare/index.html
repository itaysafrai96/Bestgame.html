<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אמת או חובה</title>
<meta name="description" content="משחק אמת או חובה בעברית – 5 רמות, מאות שאלות ומשימות, ניקוד, ג'וקרים ואירועים מיוחדים.">
<meta name="theme-color" content="#140a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#140a24; --bg2:#2a0f3d; --card:#ffffff10; --line:#ffffff22;
  --text:#fff; --muted:#c9b8e6; --truth:#22d3ee; --dare:#ff3d7f; --gold:#ffd166; --ok:#34d399;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg1)}
html,body{margin:0;min-height:100vh;}
body{font-family:Heebo,system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1200px 700px at 80% -10%,#5b1a6b 0%,transparent 60%),
             radial-gradient(900px 600px at -10% 110%,#0e4a63 0%,transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:44px;font-weight:900;margin:8px 0 2px;text-align:center;letter-spacing:-1px;line-height:1.05}
h1 .t{color:var(--truth);text-shadow:0 0 24px #22d3ee88}
h1 .d{color:var(--dare);text-shadow:0 0 24px #ff3d7f88}
.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}
.panel h2{font-size:17px;margin:0 0 10px;font-weight:800}
.row{display:flex;gap:8px}
input[type=text],textarea,select{flex:1;min-width:0;font:inherit;color:var(--text);background:#00000040;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--truth)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:#fff;font-weight:800;transition:transform .12s,filter .2s,opacity .2s}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:not-allowed}
.btn{padding:12px 16px;background:#ffffff1f}
.btn-add{background:linear-gradient(135deg,#8b5cf6,#d946ef)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;background:#ffffff18;border-radius:999px;padding:6px 8px 6px 12px;font-weight:600}
.chip button{background:#ffffff22;width:24px;height:24px;border-radius:50%;padding:0;font-size:13px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvl{background:#00000030;border:2px solid transparent;border-radius:16px;padding:12px;text-align:right;color:var(--text)}
.lvl .e{font-size:26px}
.lvl b{display:block;font-size:16px;margin-top:2px}
.lvl small{color:var(--muted);font-weight:400;font-size:12.5px}
.lvl.on{border-color:var(--dare);background:#ff3d7f22;box-shadow:0 0 0 4px #ff3d7f22}
.lvl.spicy.on{border-color:#ff6b35}
.opts label{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff10}
.opts label:last-child{border:0}
.opts input[type=checkbox]{width:22px;height:22px;accent-color:var(--dare)}
.cta{width:100%;padding:18px;font-size:21px;background:linear-gradient(135deg,var(--truth),#8b5cf6 50%,var(--dare));box-shadow:0 10px 30px #ff3d7f55}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
.hide{display:none!important}

/* game */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top .btn{padding:8px 12px;font-size:14px}
.round{color:var(--muted);font-size:14px}
.turn{text-align:center;margin:8px 0 16px}
.turn .who{font-size:15px;color:var(--muted)}
.turn .name{font-size:38px;font-weight:900;line-height:1.1}
.jokers{font-size:14px;color:var(--gold)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{height:150px;font-size:30px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.big span{font-size:13px;font-weight:600;opacity:.85}
.b-truth{background:linear-gradient(160deg,#06b6d4,#2563eb);box-shadow:0 10px 30px #06b6d455}
.b-dare{background:linear-gradient(160deg,#ff3d7f,#c026d3);box-shadow:0 10px 30px #ff3d7f55}
.b-rand{grid-column:1/-1;padding:14px;background:#ffffff1a;font-size:18px}
.card{perspective:1200px;margin:6px 0 14px}
.card-in{position:relative;min-height:260px;border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  animation:flip .55s cubic-bezier(.2,.8,.2,1.2)}
@keyframes flip{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.card-in.truth{background:linear-gradient(160deg,#0e7490,#1e3a8a);box-shadow:0 14px 40px #06b6d444}
.card-in.dare{background:linear-gradient(160deg,#be185d,#6b21a8);box-shadow:0 14px 40px #ff3d7f44}
.card-in.event{background:linear-gradient(160deg,#b45309,#7c2d12);box-shadow:0 14px 40px #ffd16644}
.tag{position:absolute;top:14px;right:16px;font-size:13px;font-weight:800;background:#00000035;padding:4px 10px;border-radius:999px}
.lv{position:absolute;top:14px;left:16px;font-size:13px;background:#00000035;padding:4px 10px;border-radius:999px}
.qtext{font-size:25px;font-weight:800;line-height:1.35}
.timer{margin-top:16px;display:flex;align-items:center;gap:10px}
.timer .clock{font-size:30px;font-weight:900;min-width:64px;font-variant-numeric:tabular-nums}
.timer .clock.done{color:var(--gold);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a-ok{padding:16px;background:linear-gradient(135deg,#10b981,#059669);font-size:18px}
.a-skip{padding:16px;background:#ffffff1f;font-size:16px}
.a-joker{grid-column:1/-1;padding:12px;background:#ffd16622;color:var(--gold);border:1px solid #ffd16655}
.a-next{grid-column:1/-1;padding:16px;background:linear-gradient(135deg,#f59e0b,#ef4444);font-size:18px}
.penalty{margin-top:12px;padding:14px;border-radius:16px;background:#ef444426;border:1px solid #ef444466;text-align:center;font-weight:700}
.scores{display:flex;flex-direction:column;gap:6px}
.sc{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#00000025}
.sc.cur{outline:2px solid var(--truth)}
.sc .n{flex:1;font-weight:700}
.sc .p{font-weight:900;font-variant-numeric:tabular-nums}
.sc .j{color:var(--gold);font-size:13px}
.bar{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--truth),var(--dare))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#000c;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .3s,opacity .3s;opacity:0;z-index:9;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:8}
.modal .panel{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#22103a}
.custom-list{max-height:180px;overflow:auto;margin-top:10px;font-size:14px}
.custom-list div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff10}
.custom-list button{background:none;color:var(--muted);padding:0 6px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:7;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:380px){h1{font-size:36px}.qtext{font-size:21px}.big{height:120px;font-size:25px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== SETUP ===== -->
  <section id="setup">
    <h1><span class="t">אמת</span> או <span class="d">חובה</span></h1>
    <p class="sub">מאות שאלות ומשימות · 5 רמות · ניקוד וג'וקרים</p>

    <div class="panel">
      <h2>👥 שחקנים</h2>
      <form class="row" id="addForm">
        <input type="text" id="pName" placeholder="שם השחקן/ית" maxlength="16" autocomplete="off">
        <button class="btn btn-add" type="submit">הוספה</button>
      </form>
      <div class="chips" id="chips"></div>
    </div>

    <div class="panel">
      <h2>🎚️ רמות (אפשר כמה)</h2>
      <div class="levels" id="levels"></div>
    </div>

    <div class="panel opts">
      <h2>⚙️ הגדרות</h2>
      <label>ניקוד (נקודה לאמת, 2 לחובה) <input type="checkbox" id="optScore" checked></label>
      <label>2 ג'וקרים לכל שחקן (דילוג בלי עונש) <input type="checkbox" id="optJoker" checked></label>
      <label>עונש למי שמוותר <input type="checkbox" id="optPenalty" checked></label>
      <label>אירועים מיוחדים מדי פעם ⚡ <input type="checkbox" id="optEvents" checked></label>
      <label>סדר שחקנים אקראי <input type="checkbox" id="optShuffle"></label>
      <label>צלילים ורטט <input type="checkbox" id="optSound" checked></label>
      <button class="btn" id="openCustom" style="width:100%;margin-top:10px" type="button">✍️ הוספת שאלות ומשימות משלכם</button>
    </div>

    <button class="cta" id="startBtn">🎲 יאללה מתחילים</button>
    <p class="hint" id="startHint"></p>
  </section>

  <!-- ===== GAME ===== -->
  <section id="game" class="hide">
    <div class="top">
      <button class="btn" id="backBtn">→ הגדרות</button>
      <span class="round" id="roundLbl"></span>
      <button class="btn" id="scoreBtn">🏆 ניקוד</button>
    </div>

    <div class="turn">
      <div class="who">התור של</div>
      <div class="name" id="curName"></div>
      <div class="jokers" id="curJokers"></div>
    </div>

    <div id="choosePane" class="choose">
      <button class="big b-truth" id="truthBtn">אמת<span>נקודה אחת</span></button>
      <button class="big b-dare" id="dareBtn">חובה<span>2 נקודות</span></button>
      <button class="b-rand" id="randBtn">🎲 תן לגורל להחליט (+ בונוס)</button>
    </div>

    <div id="cardPane" class="hide">
      <div class="card"><div class="card-in" id="cardIn">
        <span class="tag" id="cardTag"></span><span class="lv" id="cardLv"></span>
        <div class="qtext" id="qText"></div>
        <div class="timer hide" id="timerBox">
          <button class="btn" id="timerBtn">▶ טיימר</button>
          <span class="clock" id="clock"></span>
        </div>
      </div></div>
      <div class="actions" id="actions">
        <button class="a-ok" id="doneBtn">✅ בוצע!</button>
        <button class="a-skip" id="skipBtn">🙅 מוותר/ת</button>
        <button class="a-joker" id="jokerBtn">🃏 ג'וקר – כרטיס אחר בלי עונש</button>
      </div>
      <div id="penaltyBox" class="hide">
        <div class="penalty" id="penaltyText"></div>
        <div class="actions" style="margin-top:10px"><button class="a-next" id="afterPenalty">הבא בתור ←</button></div>
      </div>
    </div>

    <div id="eventPane" class="hide">
      <div class="card"><div class="card-in event">
        <span class="tag">אירוע מיוחד</span>
        <div class="qtext" id="evTitle" style="font-size:30px"></div>
        <div style="margin-top:12px;font-size:19px;font-weight:600" id="evText"></div>
      </div></div>
      <div class="actions"><button class="a-next" id="evNext">ממשיכים ←</button></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>🏆 טבלה</h2>
      <div class="scores" id="scoresMini"></div>
    </div>
  </section>
</div>

<!-- custom modal -->
<div class="modal hide" id="customModal">
  <div class="panel">
    <h2>✍️ שאלות ומשימות משלכם</h2>
    <p class="hint" style="text-align:right;margin:0 0 10px">טיפ: כתבו {p} כדי לשלב שחקן אקראי, ו-[30] בסוף משימה בשביל טיימר של 30 שניות.</p>
    <div class="row" style="margin-bottom:8px">
      <select id="cType"><option value="truth">אמת</option><option value="dare">חובה</option></select>
    </div>
    <textarea id="cText" rows="3" style="width:100%" placeholder="למשל: לחקות את {p} מזמין פיצה [20]"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-add" id="cAdd" style="flex:1">הוספה</button>
      <button class="btn" id="cClose">סגירה</button>
    </div>
    <div class="custom-list" id="cList"></div>
  </div>
</div>

<!-- scores modal -->
<div class="modal hide" id="scoreModal">
  <div class="panel">
    <h2>🏆 טבלת ניקוד</h2>
    <div class="scores" id="scoresFull"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="resetScores" style="flex:1">איפוס ניקוד</button>
      <button class="btn btn-add" id="scoreClose" style="flex:1">חזרה למשחק</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(() => {
  const D = window.TOD_DATA;
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try { const v = localStorage.getItem('tod_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v){ try { localStorage.setItem('tod_' + k, JSON.stringify(v)); } catch {} }
  };

  // ---------- state ----------
  let players = store.get('players', []);           // [{name, score, jokers, truths, dares, skips}]
  let levels = store.get('levels', ['friends']);
  let custom = store.get('custom', []);              // [{type, text}]
  const opts = Object.assign({score:true, joker:true, penalty:true, events:true, shuffle:false, sound:true}, store.get('opts', {}));
  let order = [], turnIdx = 0, round = 1, turnsSinceEvent = 0;
  let decks = {};       // key "level|type" -> shuffled array of indices remaining
  let current = null;   // {type, text, level, bonus}
  let lastEventIdx = -1;

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- sound ----------
  let ac;
  function beep(freq = 600, dur = .12, type = 'sine', vol = .15){
    if (!opts.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch {}
  }
  const chord = (fs, gap = 90) => fs.forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle'), i * gap));
  const buzz = ms => { if (opts.sound && navigator.vibrate) try { navigator.vibrate(ms); } catch {} };

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function confetti(n = 40){
    const cols = ['#22d3ee','#ff3d7f','#ffd166','#8b5cf6','#34d399'];
    for (let i = 0; i < n; i++){
      const c = document.createElement('div'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
      c.style.animationDuration = 1.4 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .3 + 's';
      document.body.appendChild(c); setTimeout(() => c.remove(), 3500);
    }
  }

  // ---------- setup screen ----------
  function save(){ store.set('players', players); store.set('levels', levels); store.set('custom', custom); store.set('opts', opts); }

  function renderChips(){
    $('chips').innerHTML = players.map((p, i) =>
      `<span class="chip">${esc(p.name)}<button data-i="${i}" aria-label="הסרה">✕</button></span>`).join('');
    const ok = players.length >= 2 && levels.length > 0;
    $('startBtn').disabled = !ok;
    $('startHint').textContent = players.length < 2 ? 'צריך לפחות 2 שחקנים' : !levels.length ? 'בחרו לפחות רמה אחת' :
      `${players.length} שחקנים · ${countCards()} כרטיסים במשחק`;
  }
  function countCards(){
    let n = custom.length;
    levels.forEach(l => { n += D.levels[l].truth.length + D.levels[l].dare.length; });
    return n;
  }
  function renderLevels(){
    $('levels').innerHTML = Object.entries(D.levels).map(([k, l]) =>
      `<button class="lvl ${k} ${levels.includes(k) ? 'on' : ''}" data-k="${k}">
        <span class="e">${l.emoji}</span><b>${l.name}</b><small>${l.desc}</small></button>`).join('');
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('pName').value.trim();
    if (!name) return;
    if (players.some(p => p.name === name)) return toast('השם הזה כבר במשחק');
    players.push({ name, score:0, jokers:2, truths:0, dares:0, skips:0 });
    $('pName').value = ''; $('pName').focus(); beep(700); save(); renderChips();
  });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    players.splice(+b.dataset.i, 1); save(); renderChips();
  });
  $('levels').addEventListener('click', e => {
    const b = e.target.closest('.lvl'); if (!b) return;
    const k = b.dataset.k;
    if (k === 'spicy' && !levels.includes(k) && !confirm('רמת פיקנטי מיועדת ל-18+ בלבד ומשחקים בה רק בהסכמה של כולם. להפעיל?')) return;
    levels = levels.includes(k) ? levels.filter(x => x !== k) : [...levels, k];
    beep(520); save(); renderLevels(); renderChips();
  });
  const optMap = {optScore:'score', optJoker:'joker', optPenalty:'penalty', optEvents:'events', optShuffle:'shuffle', optSound:'sound'};
  Object.entries(optMap).forEach(([id, k]) => {
    $(id).checked = opts[k];
    $(id).addEventListener('change', () => { opts[k] = $(id).checked; save(); });
  });

  // custom cards
  function renderCustom(){
    $('cList').innerHTML = custom.length ? custom.map((c, i) =>
      `<div><span>${c.type === 'truth' ? '💬' : '🔥'} ${esc(c.text)}</span><button data-i="${i}">✕</button></div>`).join('')
      : '<p class="hint">עוד לא הוספתם כלום</p>';
  }
  $('openCustom').onclick = () => { renderCustom(); $('customModal').classList.remove('hide'); $('cText').focus(); };
  $('cClose').onclick = () => { $('customModal').classList.add('hide'); renderChips(); };
  $('cAdd').onclick = () => {
    const text = $('cText').value.trim(); if (!text) return;
    custom.push({ type: $('cType').value, text }); $('cText').value = '';
    decks = {}; save(); renderCustom(); toast('נוסף! 🎉');
  };
  $('cList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    custom.splice(+b.dataset.i, 1); decks = {}; save(); renderCustom();
  });

  // ---------- game ----------
  function show(id){ ['choosePane','cardPane','eventPane'].forEach(x => $(x).classList.toggle('hide', x !== id)); }
  const cur = () => players[order[turnIdx]];

  function startGame(){
    if (players.length < 2 || !levels.length) return;
    order = players.map((_, i) => i);
    if (opts.shuffle) shuffle(order);
    turnIdx = 0; round = 1; turnsSinceEvent = 0; decks = {};
    players.forEach(p => { if (p.jokers == null) p.jokers = 2; });
    $('setup').classList.add('hide'); $('game').classList.remove('hide');
    chord([523, 659, 784]); renderTurn();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function renderTurn(){
    const p = cur();
    $('curName').textContent = p.name;
    $('curJokers').textContent = opts.joker ? '🃏'.repeat(p.jokers) || 'אין ג\'וקרים' : '';
    $('roundLbl').textContent = `סבב ${round}`;
    $('truthBtn').querySelector('span').textContent = opts.score ? 'נקודה אחת' : 'שאלה';
    $('dareBtn').querySelector('span').textContent = opts.score ? '2 נקודות' : 'משימה';
    $('randBtn').textContent = opts.score ? '🎲 תן לגורל להחליט (+ בונוס)' : '🎲 תן לגורל להחליט';
    show('choosePane'); renderScores();
  }

  function draw(type){
    // pool: all items of type across selected levels + custom
    const keys = [];
    levels.forEach(l => D.levels[l][type].forEach((_, i) => keys.push(l + '|' + i)));
    custom.forEach((c, i) => { if (c.type === type) keys.push('custom|' + i); });
    if (!keys.length) return null;
    const dk = type + ':' + levels.join(',');
    if (!decks[dk] || !decks[dk].length) decks[dk] = shuffle(keys.slice());
    const key = decks[dk].pop();
    const [lv, i] = key.split('|');
    const text = lv === 'custom' ? custom[+i].text : D.levels[lv][type][+i];
    return { lv, text };
  }

  function fill(text){
    const others = players.filter(p => p !== cur());
    const other = others[Math.random() * others.length | 0];
    let secs = 0;
    text = text.replace(/\s*\[(\d+)\]\s*$/, (_, s) => { secs = +s; return ''; });
    text = text.replace(/\{p\}/g, other ? other.name : 'מישהו');
    return { text, secs };
  }

  function pick(type, bonus = 0){
    const c = draw(type);
    if (!c) return toast('אין כרטיסים מהסוג הזה ברמות שבחרתם');
    const { text, secs } = fill(c.text);
    current = { type, text, secs, lv: c.lv, bonus };
    const ci = $('cardIn');
    ci.className = 'card-in ' + type; void ci.offsetWidth; // restart anim
    $('cardTag').textContent = type === 'truth' ? '💬 אמת' : '🔥 חובה';
    $('cardLv').textContent = c.lv === 'custom' ? '✍️ שלכם' : D.levels[c.lv].emoji + ' ' + D.levels[c.lv].name;
    $('qText').textContent = text;
    stopTimer();
    $('timerBox').classList.toggle('hide', !secs);
    $('clock').textContent = secs ? secs + 'ש׳' : '';
    $('clock').classList.remove('done');
    $('actions').classList.remove('hide'); $('penaltyBox').classList.add('hide');
    $('jokerBtn').classList.toggle('hide', !opts.joker || cur().jokers <= 0);
    show('cardPane'); beep(type === 'truth' ? 520 : 380, .2, 'triangle'); buzz(30);
  }

  $('truthBtn').onclick = () => pick('truth');
  $('dareBtn').onclick = () => pick('dare');
  $('randBtn').onclick = () => {
    let n = 0; const spin = setInterval(() => {
      beep(400 + (n % 2) * 200, .05); n++;
      $('randBtn').textContent = n % 2 ? '💬 אמת…' : '🔥 חובה…';
      if (n > 9){ clearInterval(spin); pick(Math.random() < .5 ? 'truth' : 'dare', 1); }
    }, 90);
  };

  // timer
  let tHandle = null, tLeft = 0;
  function stopTimer(){ clearInterval(tHandle); tHandle = null; $('timerBtn').textContent = '▶ טיימר'; }
  $('timerBtn').onclick = () => {
    if (tHandle) return stopTimer();
    tLeft = current.secs; $('clock').classList.remove('done'); $('timerBtn').textContent = '⏸ עצירה';
    $('clock').textContent = tLeft + 'ש׳';
    tHandle = setInterval(() => {
      tLeft--; $('clock').textContent = tLeft + 'ש׳';
      if (tLeft <= 3 && tLeft > 0) beep(880, .08);
      if (tLeft <= 0){ stopTimer(); $('clock').textContent = 'זמן!'; $('clock').classList.add('done'); chord([784, 988, 1175], 120); buzz([200, 100, 200]); }
    }, 1000);
  };

  $('doneBtn').onclick = () => {
    const p = cur();
    const pts = (current.type === 'dare' ? 2 : 1) + current.bonus;
    if (opts.score) p.score += pts;
    current.type === 'dare' ? p.dares++ : p.truths++;
    stopTimer(); chord([523, 659, 784, 1047], 70); buzz(40);
    if (current.type === 'dare') confetti(30);
    if (opts.score) toast(`${p.name} קיבל/ה ${pts} נק׳! 🎉`);
    nextTurn();
  };
  $('skipBtn').onclick = () => {
    const p = cur(); p.skips++; stopTimer();
    if (opts.score) p.score = Math.max(0, p.score - 1);
    beep(180, .35, 'sawtooth', .1); buzz(150);
    if (opts.penalty){
      $('penaltyText').textContent = '😈 עונש: ' + D.penalties[Math.random() * D.penalties.length | 0];
      $('actions').classList.add('hide'); $('penaltyBox').classList.remove('hide');
    } else nextTurn();
  };
  $('afterPenalty').onclick = nextTurn;
  $('jokerBtn').onclick = () => {
    const p = cur(); if (p.jokers <= 0) return;
    p.jokers--; toast('🃏 ג\'וקר! כרטיס חדש'); save();
    pick(current.type, current.bonus);
  };

  function nextTurn(){
    turnIdx++;
    if (turnIdx >= order.length){ turnIdx = 0; round++; }
    turnsSinceEvent++; save();
    if (opts.events && turnsSinceEvent >= 5 && Math.random() < .3) return showEvent();
    renderTurn();
  }

  function showEvent(){
    turnsSinceEvent = 0;
    let i; do { i = Math.random() * D.events.length | 0; } while (i === lastEventIdx && D.events.length > 1);
    lastEventIdx = i;
    const ev = D.events[i];
    $('evTitle').textContent = ev.t; $('evText').textContent = ev.d;
    if (ev.joker && opts.joker){
      const low = players.reduce((a, b) => b.score < a.score ? b : a);
      low.jokers++; $('evText').textContent += ` (${low.name} 🃏)`;
    }
    show('eventPane'); chord([392, 523, 659, 784], 100); buzz([60, 40, 60]); renderScores();
  }
  $('evNext').onclick = renderTurn;

  function scoresHTML(full){
    const max = Math.max(1, ...players.map(p => p.score));
    const sorted = players.map((p, i) => ({p, i})).sort((a, b) => b.p.score - a.p.score);
    return sorted.map(({p, i}, rank) => `
      <div class="sc ${i === order[turnIdx] && !$('game').classList.contains('hide') ? 'cur' : ''}">
        <span>${rank === 0 && p.score > 0 ? '👑' : rank + 1 + '.'}</span>
        <div class="n">${esc(p.name)}
          ${full ? `<div class="hint" style="text-align:right;margin:2px 0 0">💬 ${p.truths} · 🔥 ${p.dares} · 🙅 ${p.skips}</div>` : ''}
          <div class="bar"><i style="width:${p.score / max * 100}%"></i></div></div>
        ${opts.joker ? `<span class="j">${'🃏'.repeat(p.jokers)}</span>` : ''}
        ${opts.score ? `<span class="p">${p.score}</span>` : ''}
      </div>`).join('');
  }
  function renderScores(){ $('scoresMini').innerHTML = scoresHTML(false); }

  $('scoreBtn').onclick = () => { $('scoresFull').innerHTML = scoresHTML(true); $('scoreModal').classList.remove('hide'); };
  $('scoreClose').onclick = () => $('scoreModal').classList.add('hide');
  $('resetScores').onclick = () => {
    if (!confirm('לאפס את הניקוד והג\'וקרים של כולם?')) return;
    players.forEach(p => Object.assign(p, {score:0, jokers:2, truths:0, dares:0, skips:0}));
    save(); $('scoresFull').innerHTML = scoresHTML(true); renderScores(); renderTurn();
  };
  $('backBtn').onclick = () => { stopTimer(); $('game').classList.add('hide'); $('setup').classList.remove('hide'); renderChips(); };
  $('startBtn').onclick = startGame;
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.add('hide'); }));

  renderLevels(); renderChips();
})();
</script>
</body>
</html>
